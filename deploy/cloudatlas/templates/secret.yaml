apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudatlas.fullname" . }}-backend
  labels:
    app.kubernetes.io/name: {{ include "cloudatlas.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "backend.jwtSecret is required" .Values.backend.jwtSecret | quote }}
  ENCRYPTION_KEY: {{ required "backend.encryptionKey is required" .Values.backend.encryptionKey | quote }}
  {{- if .Values.backend.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.backend.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.backend.smtpHost }}
  SMTP_HOST: {{ .Values.backend.smtpHost | quote }}
  SMTP_PORT: {{ .Values.backend.smtpPort | quote }}
  SMTP_USERNAME: {{ .Values.backend.smtpUsername | quote }}
  SMTP_PASSWORD: {{ .Values.backend.smtpPassword | quote }}
  SMTP_FROM: {{ .Values.backend.smtpFrom | quote }}
  {{- end }}
  {{- if .Values.backend.redisUrl }}
  REDIS_URL: {{ .Values.backend.redisUrl | quote }}
  {{- end }}
  {{- if .Values.backend.sentryDsn }}
  SENTRY_DSN: {{ .Values.backend.sentryDsn | quote }}
  {{- end }}
