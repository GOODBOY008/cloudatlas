apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudatlas.fullname" . }}-backend
  labels:
    app.kubernetes.io/name: {{ include "cloudatlas.name" . }}
    app.kubernetes.io/component: backend
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cloudatlas.name" . }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "cloudatlas.name" . }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}-backend:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
          env:
            - name: APP_ENV
              value: "production"
            - name: DATABASE_URL
              value: {{ include "cloudatlas.databaseUrl" . | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "cloudatlas.fullname" . }}-backend
                  key: JWT_SECRET
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cloudatlas.fullname" . }}-backend
                  key: ENCRYPTION_KEY
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.backend.corsOrigins | quote }}
            - name: RATE_LIMIT_MAX_REQUESTS
              value: {{ .Values.backend.rateLimitMaxRequests | quote }}
            - name: RATE_LIMIT_WINDOW_SECS
              value: {{ .Values.backend.rateLimitWindowSecs | quote }}
            - name: AI_ENABLED
              value: {{ .Values.backend.aiEnabled | quote }}
            {{- if .Values.backend.openaiApiKey }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cloudatlas.fullname" . }}-backend
                  key: OPENAI_API_KEY
            {{- end }}
            {{- if .Values.backend.smtpHost }}
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "cloudatlas.fullname" . }}-backend
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ include "cloudatlas.fullname" . }}-backend
                  key: SMTP_PORT
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "cloudatlas.fullname" . }}-backend
                  key: SMTP_USERNAME
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cloudatlas.fullname" . }}-backend
                  key: SMTP_PASSWORD
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: {{ include "cloudatlas.fullname" . }}-backend
                  key: SMTP_FROM
            {{- end }}
            {{- if .Values.backend.redisUrl }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "cloudatlas.fullname" . }}-backend
                  key: REDIS_URL
            {{- end }}
            {{- if .Values.backend.sentryDsn }}
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "cloudatlas.fullname" . }}-backend
                  key: SENTRY_DSN
            {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudatlas.fullname" . }}-backend
  labels:
    app.kubernetes.io/name: {{ include "cloudatlas.name" . }}
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: {{ include "cloudatlas.name" . }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: {{ .Values.backend.port }}
