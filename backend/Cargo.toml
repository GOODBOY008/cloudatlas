[package]
name        = "cloudatlas"
version     = "0.1.0"
edition     = "2021"
description = "CloudAtlas — Unified FinOps + CMDB Platform"
authors     = ["CloudAtlas Team"]

[[bin]]
name = "cloudatlas"
path = "src/main.rs"

[lib]
name = "cloudatlas_lib"
path = "src/lib.rs"

[dependencies]
# ── Async runtime ──────────────────────────────────────────────
tokio          = { version = "1.38", features = ["full"] }

# ── Web framework ──────────────────────────────────────────────
axum           = { version = "0.7", features = ["macros", "multipart"] }
tower          = { version = "0.4", features = ["full"] }
tower-http     = { version = "0.5", features = ["cors", "trace", "compression-gzip", "request-id", "timeout"] }

# ── Database ───────────────────────────────────────────────────
sqlx           = { version = "0.7", features = [
    "runtime-tokio-native-tls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "macros",
] }

# ── Serialization ──────────────────────────────────────────────
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
csv            = "1"
flate2         = "1"

# ── Authentication ─────────────────────────────────────────────
jsonwebtoken   = "9"
argon2         = "0.5"
rand           = "0.8"
hex            = "0.4"

# ── UUID & time ────────────────────────────────────────────────
uuid           = { version = "1", features = ["v4", "serde"] }
chrono         = { version = "0.4", features = ["serde"] }
regex          = "1"

# ── Config & env ───────────────────────────────────────────────
dotenvy        = "0.15"
config         = "0.14"

# ── Error handling ─────────────────────────────────────────────
anyhow         = "1"
thiserror      = "1"

# ── Tracing / observability ────────────────────────────────────
tracing                = "0.1"
tracing-subscriber     = { version = "0.3", features = ["env-filter", "json"] }

# ── HTTP client (cloud adapters) ───────────────────────────────
reqwest        = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
quick-xml      = "0.36"
# Kubeconfig parsing for ACK cluster workload discovery (already in the
# dependency tree via `config`, so no new download).
yaml-rust2     = "0.8"

# ── AWS SDK ────────────────────────────────────────────────────
aws-config           = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-ec2          = "1"
aws-sdk-rds          = "1"
aws-sdk-s3           = "1"
aws-credential-types = "1"

# ── Aliyun signing (HMAC-SHA1 RPC) ────────────────────────────
hmac                 = "0.12"
sha1                 = "0.10"

# ── OpenAPI ────────────────────────────────────────────────────
utoipa         = { version = "4", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "6", features = ["axum"] }

# ── Crypto (credential encryption) ────────────────────────────
aes-gcm        = "0.10"
base64         = "0.22"

# ── Numeric ───────────────────────────────────────────────────
rust_decimal   = { version = "1", features = ["serde"] }

# ── Scheduling ────────────────────────────────────────────────
cron           = "0.12"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls", "pool"] }
futures-util = "0.3"
sentry = { version = "0.34", default-features = false, features = ["backtrace", "rustls"] }
redis = { version = "0.27", features = ["tokio-comp"] }
sha2 = "0.10"
totp-lite = "2.0.1"
base32 = "0.5"

[dev-dependencies]
tokio-test     = "0.4"
axum-test      = "14"
serde_urlencoded = "0.7"
