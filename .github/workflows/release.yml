name: Release Docker Images

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'        # v1.2.3
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+' # v1.2.3-rc.1
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. v1.0.0 or latest)'
        required: true
        default: 'latest'
        type: string

env:
  REGISTRY: ghcr.io
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  packages: write

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # Gate: run CI checks before releasing
  # ──────────────────────────────────────────────────────────────────────────────
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ──────────────────────────────────────────────────────────────────────────────
  # Prepare: resolve tag metadata
  # ──────────────────────────────────────────────────────────────────────────────
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      created: ${{ steps.meta.outputs.created }}
    steps:
      - name: Resolve version
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────────────────────
  # Build & push images (matrix: api, frontend, migrate)
  # ──────────────────────────────────────────────────────────────────────────────
  build-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [ci, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: docker/backend.Dockerfile
            description: CloudAtlas Backend API
          - image: frontend
            dockerfile: docker/frontend.Dockerfile
            description: CloudAtlas Frontend
          - image: migrate
            dockerfile: docker/migrate.Dockerfile
            description: CloudAtlas DB Migration Runner

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/cloudatlas-${{ matrix.image }}
          tags: |
            # raw tag from dispatch or git ref
            type=raw,value=${{ needs.prepare.outputs.version }}
            # semver: v1.2.3 → 1.2.3
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
            # semver major.minor: v1.2.3 → 1.2
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }}
            # semver major: v1.2.3 → 1
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.version }}
            # git SHA (only on tag push, not dispatch)
            type=sha,prefix=,format=short,enable=${{ github.event_name == 'push' }}
            # latest for stable releases only (no -rc, no dispatch "latest" duplicate)
            type=raw,value=latest,enable=${{ !contains(needs.prepare.outputs.version, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.title=cloudatlas-${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # ──────────────────────────────────────────────────────────────────────────────
  # Summary: post build results
  # ──────────────────────────────────────────────────────────────────────────────
  summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [build-push, prepare]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## 🐳 Docker Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Version** | \`${{ needs.prepare.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Registry** | \`ghcr.io/${{ github.repository_owner }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Platforms** | \`linux/amd64\`, \`linux/arm64\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Images Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/cloudatlas-api:${{ needs.prepare.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/cloudatlas-frontend:${{ needs.prepare.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/cloudatlas-migrate:${{ needs.prepare.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ needs.build-push.result }}" == "success" ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ All images built and pushed successfully." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ Build failed. Check the logs above." >> "$GITHUB_STEP_SUMMARY"
          fi
