---
name: "🐛 Bug Report"
description: Report a bug or unexpected behavior in CloudAtlas
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below to help us reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: When I do X, Y happens instead of Z...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include error messages, stack traces, or screenshots.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of CloudAtlas is affected?
      options:
        - Backend (Rust API)
        - Frontend (React UI)
        - Database / Migrations
        - Docker / Deployment
        - E2E Tests
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please provide environment details:
        - OS (e.g. macOS 14, Ubuntu 22.04)
        - Rust version (`rustc --version`)
        - Node.js version (`node --version`)
        - Docker version (if applicable)
        - Browser (for frontend bugs)
      placeholder: |
        - OS: macOS 14.5
        - Rust: 1.78.0
        - Node: 20.11.0
        - Browser: Chrome 125
      render: markdown
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      description: Paste any relevant log output, stack traces, or screenshots here.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context about the problem (related issues, workarounds you've tried, etc.).
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have tested this against the latest `main` branch
          required: true
        - label: I have included enough information to reproduce the issue
          required: true
