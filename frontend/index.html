<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8fa" />
    <meta name="description" content="CloudAtlas — a clear view of your cloud costs, assets, and operations." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CloudAtlas</title>
    <!-- Restore a saved preference before the stylesheet paints. -->
    <script>
      ;(function () {
        try {
          var stored = JSON.parse(localStorage.getItem('cloudatlas-theme') || '{}')
          var dark = stored.state && stored.state.theme === 'dark'
          document.documentElement.classList.toggle('dark', Boolean(dark))
          document.querySelector('meta[name="theme-color"]').content = dark ? '#0f1620' : '#f6f8fa'
        } catch (_) { /* The default light theme also works without storage. */ }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
